name: BabyBrujin

on:
  push:
    branches:
      - '**'
      - '!main'

jobs:
  create_pull_request:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Get branch name
        id: branch-name
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Create dummy change
        run: |
          echo "This is a dummy change" > dummy_change.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dummy_change.txt
          git commit -m "Add dummy change for PR"
      
      - name: Create pull request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}
          commit-message: Automatically created PR
          title: 'Auto PR from ${{ steps.branch-name.outputs.BRANCH_NAME }}'
          body: 'This is an auto-generated PR.'
          branch: 'auto-pr-${{ steps.branch-name.outputs.BRANCH_NAME }}'
          base: main
          delete-branch: true
          draft: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build
        run: cargo build --verbose
        working-directory: ./baby_brujin
      - name: Run tests
        run: cargo test --verbose
        working-directory: ./baby_brujin